syntax = "proto3";

package nexus.gates.telemetry;

option go_package = "nexus-gates/monitoring-hub/proto";

message StatusReport {
  string module_id = 1;
  string module_type = 2;
  ModuleStatus status = 3;
  int64 timestamp = 4;
  map<string, string> metadata = 5;
  repeated Metric metrics = 6;
}

enum ModuleStatus {
  MODULE_STATUS_UNKNOWN = 0;
  MODULE_STATUS_HEALTHY = 1;
  MODULE_STATUS_DEGRADED = 2;
  MODULE_STATUS_FAILED = 3;
  MODULE_STATUS_INITIALIZING = 4;
}

message Metric {
  string name = 1;
  double value = 2;
  string unit = 3;
  int64 timestamp = 4;
}

message Acknowledgment {
  bool success = 1;
  string message = 2;
  int64 timestamp = 3;
}

message HeartbeatRequest {
  string module_id = 1;
  int64 timestamp = 2;
}

message HeartbeatResponse {
  bool alive = 1;
  int64 server_timestamp = 2;
}

service ModuleTelemetry {
  rpc ReportStatus(StatusReport) returns (Acknowledgment);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

