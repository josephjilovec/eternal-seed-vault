/**
 * Purpose: gRPC service definitions for Resilience-Mesh MessageBus
 * Dependencies: protobuf compiler
 * Module Role: Network communication protocol definitions
 */

syntax = "proto3";

package nexus.gates.mesh;

// Node information for P2P gossip
message NodeInfo {
  string node_id = 1;
  string address = 2;
  int32 port = 3;
  repeated string protocols = 4;
  int64 last_seen = 5;
}

// Protocol rotation request
message ProtocolRequest {
  string current_protocol = 1;
  string target_protocol = 2;
}

// Protocol rotation response
message ProtocolResponse {
  bool success = 1;
  string active_protocol = 2;
  int32 port = 3;
  string message = 4;
}

// Port hop request
message PortHopRequest {
  string protocol = 1;
  int32 current_port = 2;
  int32 min_port = 3;
  int32 max_port = 4;
}

// Port hop response
message PortHopResponse {
  bool success = 1;
  int32 new_port = 2;
  string message = 3;
}

// Resilience-Mesh service
service ResilienceMesh {
  rpc RegisterNode(NodeInfo) returns (ProtocolResponse);
  rpc ProtocolRotation(ProtocolRequest) returns (ProtocolResponse);
  rpc PortHop(PortHopRequest) returns (PortHopResponse);
}

