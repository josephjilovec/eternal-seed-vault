/**
 * Purpose: gRPC service definitions for cross-language telemetry
 * Dependencies: protobuf compiler
 * Module Role: Universal communication protocol for all modules
 */

syntax = "proto3";

package nexus.gates.telemetry;

// Status report from any module
message StatusReport {
  string module_id = 1;
  string module_type = 2;
  ModuleStatus status = 3;
  int64 timestamp = 4;
  map<string, string> metadata = 5;
  repeated Metric metrics = 6;
}

// Module status enumeration
enum ModuleStatus {
  MODULE_STATUS_UNKNOWN = 0;
  MODULE_STATUS_HEALTHY = 1;
  MODULE_STATUS_DEGRADED = 2;
  MODULE_STATUS_FAILED = 3;
  MODULE_STATUS_INITIALIZING = 4;
}

// Performance metric
message Metric {
  string name = 1;
  double value = 2;
  string unit = 3;
  int64 timestamp = 4;
}

// Acknowledgment response
message Acknowledgment {
  bool success = 1;
  string message = 2;
  int64 timestamp = 3;
}

// Heartbeat request
message HeartbeatRequest {
  string module_id = 1;
  int64 timestamp = 2;
}

// Heartbeat response
message HeartbeatResponse {
  bool alive = 1;
  int64 server_timestamp = 2;
}

// Telemetry service for module status reporting
service ModuleTelemetry {
  rpc ReportStatus(StatusReport) returns (Acknowledgment);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

